<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">C-Link のローカル構成</title>
  <desc id="desc">ローカルアプリが localhost 上の C-Link に接続します。C-Link は SQLite アーカイブを検索し、任意のローカルモデルサーバーにチャットを送ります。C-Link のクラウドアカウントは不要です。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131f35"/></linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd1c5"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/></marker>
    <marker id="back" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#7dd3fc"/></marker>
    <style>
      .title{font:700 32px 'Yu Gothic UI','Meiryo',sans-serif;fill:#f8fafc}.sub{font:400 16px 'Yu Gothic UI','Meiryo',sans-serif;fill:#a8bbd5}
      .label{font:700 17px 'Yu Gothic UI','Meiryo',sans-serif;fill:#f8fafc}.body{font:400 13px 'Yu Gothic UI','Meiryo',sans-serif;fill:#b6c6dc}
      .tiny{font:600 11px 'Yu Gothic UI','Meiryo',sans-serif;fill:#94a9c4;letter-spacing:.3px}.card{fill:#17243a;stroke:#2c405b;stroke-width:1.5}.inner{fill:#101b2d;stroke:#30445f;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/><circle cx="1060" cy="105" r="165" fill="#0e7490" opacity=".10"/><circle cx="155" cy="550" r="210" fill="#14b8a6" opacity=".07"/>
  <text x="56" y="66" class="title">C-Link · ローカル・コンテキストとメモリー</text>
  <text x="58" y="96" class="sub">1台のコンピューターで、モデルも記憶も自分で管理。</text>
  <rect x="947" y="42" width="196" height="34" rx="17" fill="#123c45" stroke="#1c6f77"/><circle cx="968" cy="59" r="5" fill="#5eead4"/><text x="982" y="64" class="tiny" fill="#baf6ed">ローカルが既定</text>
  <text x="58" y="151" class="tiny">利用するアプリ</text>
  <g filter="url(#shadow)"><rect x="58" y="171" width="228" height="68" rx="15" class="card"/><rect x="58" y="253" width="228" height="68" rx="15" class="card"/><rect x="58" y="335" width="228" height="68" rx="15" class="card"/><rect x="58" y="417" width="228" height="68" rx="15" class="card"/></g>
  <g fill="#5eead4"><circle cx="84" cy="205" r="9"/><circle cx="84" cy="287" r="9"/><circle cx="84" cy="369" r="9"/><circle cx="84" cy="451" r="9"/></g>
  <text x="106" y="202" class="label">Open WebUI</text><text x="106" y="222" class="body">ローカルチャット画面</text>
  <text x="106" y="284" class="label">Continue</text><text x="106" y="304" class="body">コーディング支援</text>
  <text x="106" y="366" class="label">Hermes Agent</text><text x="106" y="386" class="body">OpenAI 互換クライアント</text>
  <text x="106" y="448" class="label">自分のアプリ</text><text x="106" y="468" class="body">OpenAI SDK · HTTP · CLI</text>
  <path d="M286 330H355" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/><text x="297" y="313" class="tiny">HTTP · localhost</text>
  <g filter="url(#shadow)"><rect x="373" y="157" width="443" height="352" rx="22" fill="#102e3b" stroke="#2fb7b0" stroke-width="2"/></g>
  <rect x="396" y="178" width="397" height="67" rx="14" fill="url(#link)"/><text x="420" y="207" class="label" style="fill:#06242c">C-Link API</text><text x="420" y="229" class="body" style="fill:#0a3440">127.0.0.1:9940 · /v1/chat/completions</text>
  <rect x="397" y="265" width="188" height="88" rx="14" class="inner"/><rect x="603" y="265" width="190" height="88" rx="14" class="inner"/>
  <text x="416" y="296" class="label">コンテキスト整形</text><text x="416" y="321" class="body">現在の記憶を上限内に</text>
  <text x="622" y="296" class="label">過去の記録を検索</text><text x="622" y="321" class="body">FTS5 · 根拠を引用</text>
  <rect x="397" y="371" width="396" height="91" rx="14" class="inner"/><text x="418" y="405" class="label">セッションとテナントの分離</text><text x="418" y="431" class="body">ローカル限定 · 登録やクラウドアカウント不要</text>
  <text x="398" y="489" class="tiny">共有時のみ、管理者が任意の API キーを発行</text>
  <path d="M816 331H886" stroke="#7dd3fc" stroke-width="3" marker-start="url(#back)" marker-end="url(#arrow)"/><text x="821" y="310" class="tiny">チャット要求</text>
  <text x="902" y="151" class="tiny">任意のローカルモデル</text>
  <g filter="url(#shadow)"><rect x="901" y="171" width="241" height="204" rx="20" class="card"/></g>
  <rect x="928" y="196" width="58" height="58" rx="16" fill="#183d55"/><path d="M945 226l12-19 12 19-12 19z" fill="none" stroke="#7dd3fc" stroke-width="2.5"/><text x="1002" y="219" class="label">llama.cpp</text><text x="1002" y="242" class="body">または互換サーバー</text>
  <line x1="928" y1="276" x2="1115" y2="276" stroke="#30445f"/><text x="928" y="307" class="body">Qwen · Llama · その他</text><text x="928" y="332" class="body">C-Link とは別に起動</text><text x="901" y="407" class="tiny">モデル本体は付属しません</text>
  <g filter="url(#shadow)"><rect x="901" y="444" width="241" height="80" rx="17" fill="#211d39" stroke="#504487" stroke-width="1.5"/></g>
  <path d="M927 468h27v28h-27zM932 463h27v28" fill="none" stroke="#c4b5fd" stroke-width="2"/><text x="971" y="477" class="label">SQLite アーカイブ</text><text x="971" y="500" class="body">自分の端末に保存</text>
  <path d="M606 509V551H1000V524" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="58" y="562" width="1084" height="50" rx="14" fill="#0d1928" stroke="#253a53"/><circle cx="82" cy="587" r="5" fill="#5eead4"/><text x="99" y="592" class="body">C-Link のメモリー機能にホストサービス、公開アカウント、インターネット接続は不要です。</text>
</svg>
