<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Live local API check</title><desc id="desc">VERIFIED REQUESTS · LOCALHOST ONLY: /health, /health/provider, and /v1/models each returned HTTP 200.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#15243a"/></linearGradient><style>.heading{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.sub{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#9fb4ca}.mono{font:600 15px 'Consolas','Courier New',monospace;fill:#dbeafe}.green{font:700 13px 'Consolas','Courier New',monospace;fill:#5eead4}.result{font:400 14px 'Consolas','Courier New',monospace;fill:#c2d2e4}.caption{font:500 12px 'Segoe UI',Arial,sans-serif;fill:#91a6bf;letter-spacing:.4px}</style></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><text x="54" y="65" class="heading">Live local API check</text><text x="56" y="92" class="sub">C-Link 0.5.0 · localhost:9940 · 2026-09-26</text><rect x="56" y="124" width="1088" height="424" rx="18" fill="#050b14" stroke="#31435b" stroke-width="1.5"/><circle cx="84" cy="153" r="6" fill="#fb7185"/><circle cx="105" cy="153" r="6" fill="#fbbf24"/><circle cx="126" cy="153" r="6" fill="#4ade80"/><text x="163" y="158" class="caption">VERIFIED REQUESTS · LOCALHOST ONLY</text><text x="88" y="215" class="mono">$ curl -sS http://127.0.0.1:9940/health</text><text x="932" y="215" class="green">200 OK</text><text x="112" y="246" class="result">status: ok   memory: ready</text><line x1="88" y1="268" x2="1112" y2="268" stroke="#1f2e42"/><text x="88" y="327" class="mono">$ curl -sS http://127.0.0.1:9940/health/provider</text><text x="932" y="327" class="green">200 OK</text><text x="112" y="358" class="result">provider: llama.cpp   loaded models: 1</text><line x1="88" y1="380" x2="1112" y2="380" stroke="#1f2e42"/><text x="88" y="439" class="mono">$ curl -sS http://127.0.0.1:9940/v1/models</text><text x="932" y="439" class="green">200 OK</text><text x="112" y="470" class="result">public model: local-model</text><rect x="56" y="570" width="1088" height="34" rx="12" fill="#102c33" stroke="#1c5960"/><circle cx="76" cy="587" r="4" fill="#5eead4"/><text x="91" y="592" class="caption">NO SIGN-UP · NO C-LINK CLOUD · DATA STAYS IN THE LOCAL INSTALL</text></svg>