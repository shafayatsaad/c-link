<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">C-Link local-first architecture</title>
  <desc id="desc">Local apps connect to C-Link on localhost. C-Link compiles context and searches a local SQLite archive, then sends chat requests to an optional local model server. No C-Link cloud account is needed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131f35"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10 0L0 5L10 10Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .sub{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#a8bbd5}
      .label{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .body{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#b6c6dc}
      .tiny{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#94a9c4;letter-spacing:.5px}
      .card{fill:#17243a;stroke:#2c405b;stroke-width:1.5}
      .inner{fill:#101b2d;stroke:#30445f;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="105" r="165" fill="#0e7490" opacity=".10"/>
  <circle cx="155" cy="550" r="210" fill="#14b8a6" opacity=".07"/>
  <text x="56" y="66" class="title">C-Link · local context &amp; memory gateway</text>
  <text x="58" y="96" class="sub">One computer. Your model, your archive, your control.</text>
  <rect x="947" y="42" width="196" height="34" rx="17" fill="#123c45" stroke="#1c6f77"/>
  <circle cx="968" cy="59" r="5" fill="#5eead4"/>
  <text x="982" y="64" class="tiny" fill="#baf6ed">LOCAL BY DEFAULT</text>

  <text x="58" y="151" class="tiny">YOUR APPS</text>
  <g filter="url(#shadow)">
    <rect x="58" y="171" width="228" height="68" rx="15" class="card"/>
    <rect x="58" y="253" width="228" height="68" rx="15" class="card"/>
    <rect x="58" y="335" width="228" height="68" rx="15" class="card"/>
    <rect x="58" y="417" width="228" height="68" rx="15" class="card"/>
  </g>
  <g fill="#5eead4">
    <circle cx="84" cy="205" r="9"/><circle cx="84" cy="287" r="9"/>
    <circle cx="84" cy="369" r="9"/><circle cx="84" cy="451" r="9"/>
  </g>
  <text x="106" y="202" class="label">Open WebUI</text><text x="106" y="222" class="body">Local chat interface</text>
  <text x="106" y="284" class="label">Continue</text><text x="106" y="304" class="body">Coding assistant</text>
  <text x="106" y="366" class="label">Hermes Agent</text><text x="106" y="386" class="body">OpenAI-compatible client</text>
  <text x="106" y="448" class="label">Your own app</text><text x="106" y="468" class="body">OpenAI SDK · HTTP · CLI</text>

  <path d="M286 330H355" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="297" y="313" class="tiny">HTTP · LOCALHOST</text>

  <g filter="url(#shadow)">
    <rect x="373" y="157" width="443" height="352" rx="22" fill="#102e3b" stroke="#2fb7b0" stroke-width="2"/>
  </g>
  <rect x="396" y="178" width="397" height="67" rx="14" fill="url(#link)"/>
  <text x="420" y="207" class="label" style="fill:#06242c">C-Link API</text>
  <text x="420" y="229" class="body" style="fill:#0a3440">127.0.0.1:9940 · /v1/chat/completions</text>
  <rect x="397" y="265" width="188" height="88" rx="14" class="inner"/>
  <rect x="603" y="265" width="190" height="88" rx="14" class="inner"/>
  <text x="416" y="296" class="label">Context compiler</text>
  <text x="416" y="321" class="body">Bounded current memory</text>
  <text x="622" y="296" class="label">Archive retrieval</text>
  <text x="622" y="321" class="body">FTS5 · evidence excerpts</text>
  <rect x="397" y="371" width="396" height="91" rx="14" class="inner"/>
  <text x="418" y="405" class="label">Session and tenant isolation</text>
  <text x="418" y="431" class="body">Loopback use by default · no sign-up or cloud account</text>
  <text x="398" y="489" class="tiny">OPTIONAL API-KEY TENANTS FOR OPERATOR-MANAGED LOCAL SHARING</text>

  <path d="M816 331H886" stroke="#7dd3fc" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <text x="821" y="310" class="tiny">CHAT REQUESTS</text>

  <text x="902" y="151" class="tiny">OPTIONAL LOCAL MODEL</text>
  <g filter="url(#shadow)">
    <rect x="901" y="171" width="241" height="204" rx="20" class="card"/>
  </g>
  <rect x="928" y="196" width="58" height="58" rx="16" fill="#183d55"/>
  <path d="M945 226l12-19 12 19-12 19z" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
  <text x="1002" y="219" class="label">llama.cpp</text>
  <text x="1002" y="242" class="body">or compatible server</text>
  <line x1="928" y1="276" x2="1115" y2="276" stroke="#30445f"/>
  <text x="928" y="307" class="body">Qwen · Llama · other models</text>
  <text x="928" y="332" class="body">Runs separately from C-Link</text>
  <text x="901" y="407" class="tiny">NO MODEL WEIGHTS INCLUDED</text>

  <g filter="url(#shadow)">
    <rect x="901" y="444" width="241" height="80" rx="17" fill="#211d39" stroke="#504487" stroke-width="1.5"/>
  </g>
  <path d="M927 468h27v28h-27zM932 463h27v28" fill="none" stroke="#c4b5fd" stroke-width="2"/>
  <text x="971" y="477" class="label">SQLite archive</text>
  <text x="971" y="500" class="body">Stored on your machine</text>
  <path d="M606 509V551H1000V524" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="58" y="562" width="1084" height="50" rx="14" fill="#0d1928" stroke="#253a53"/>
  <circle cx="82" cy="587" r="5" fill="#5eead4"/>
  <text x="99" y="592" class="body">C-Link does not need a hosted service, public account, or internet connection to manage your memory.</text>
</svg>
