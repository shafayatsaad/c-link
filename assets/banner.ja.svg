<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
  <title id="title">C-Link ローカル AI メモリーゲートウェイ</title>
  <desc id="desc">C-Link はコンテキストと会話メモリーを自分のコンピューターに保存します。ホストアカウントやクラウドは不要です。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".56" stop-color="#10243b"/><stop offset="1" stop-color="#123d4b"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b8d5e8" stroke-opacity=".055" stroke-width="1"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/></filter>
    <style>
      .eyebrow{font:700 13px 'Yu Gothic UI','Meiryo',sans-serif;fill:#9bded8;letter-spacing:1.4px}
      .title{font:800 72px 'Segoe UI',Arial,sans-serif;fill:#f8fafc;letter-spacing:-2px}
      .subtitle{font:400 24px 'Yu Gothic UI','Meiryo',sans-serif;fill:#bed0e2}
      .badge{font:700 11px 'Yu Gothic UI','Meiryo',sans-serif;fill:#d8edf5;letter-spacing:.4px}
      .nodeTitle{font:700 14px 'Yu Gothic UI','Meiryo',sans-serif;fill:#f8fafc}
      .nodeBody{font:400 12px 'Yu Gothic UI','Meiryo',sans-serif;fill:#a9bed2}
    </style>
  </defs>
  <rect width="1440" height="400" rx="28" fill="url(#bg)"/><rect width="1440" height="400" rx="28" fill="url(#grid)"/><ellipse cx="1170" cy="190" rx="360" ry="290" fill="url(#glow)"/><path d="M0 334C235 276 390 392 630 333s358-83 810-6v73H0z" fill="#07111f" opacity=".30"/>
  <text x="84" y="92" class="eyebrow">ローカル AI · コンテキスト · メモリー</text><text x="78" y="190" class="title">C-Link</text><rect x="82" y="215" width="440" height="4" rx="2" fill="url(#brand)"/><text x="84" y="267" class="subtitle">AI アプリもモデルも記憶も、自分の手元に。</text>
  <rect x="84" y="304" width="143" height="34" rx="17" fill="#113a43" stroke="#236b70"/><circle cx="101" cy="321" r="4" fill="#5eead4"/><text x="113" y="325" class="badge">ローカル優先</text>
  <rect x="239" y="304" width="144" height="34" rx="17" fill="#142e49" stroke="#315677"/><circle cx="256" cy="321" r="4" fill="#7dd3fc"/><text x="268" y="325" class="badge">オープンソース</text>
  <rect x="395" y="304" width="154" height="34" rx="17" fill="#202448" stroke="#4b4e83"/><circle cx="412" cy="321" r="4" fill="#c4b5fd"/><text x="424" y="325" class="badge">アカウント不要</text>
  <g filter="url(#shadow)"><rect x="787" y="69" width="558" height="263" rx="24" fill="#0b1929" stroke="#2b455e" stroke-width="1.5"/><rect x="812" y="91" width="508" height="56" rx="14" fill="#123a46" stroke="#2f8c8b"/><circle cx="840" cy="119" r="10" fill="#5eead4"/><text x="864" y="124" class="nodeTitle">OpenAI 互換のローカル API</text>
    <path d="M1066 148v28M1066 176H916v17M1066 176h153v17" stroke="#7dd3fc" stroke-opacity=".8" stroke-width="2" fill="none"/><rect x="836" y="195" width="218" height="90" rx="15" fill="#14243a" stroke="#324b68"/><rect x="1081" y="195" width="218" height="90" rx="15" fill="#14243a" stroke="#324b68"/>
    <path d="M861 220h24v27h-24zM866 215h24v27" stroke="#c4b5fd" stroke-width="2" fill="none"/><text x="899" y="229" class="nodeTitle">SQLite アーカイブ</text><text x="899" y="251" class="nodeBody">セッション · 履歴 · コンテキスト</text>
    <path d="M1108 229h26m-13-13v26m-13-13h26" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/><text x="1150" y="229" class="nodeTitle">利用者のモデル</text><text x="1150" y="251" class="nodeBody">llama.cpp · ローカル接続先</text><path d="M945 147v31m243-31v31" stroke="#7dd3fc" stroke-opacity=".38" stroke-width="2" stroke-dasharray="4 6"/><text x="830" y="313" class="nodeBody">すべての構成要素を自分で管理できます。</text>
  </g>
</svg>
