name: c-link

services:
  c-link:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      C_LINK_ENV: production
      C_LINK_AUTH_MODE: api_key
      C_LINK_BEHIND_TLS_PROXY: "true"
      C_LINK_DATA_DIR: /var/lib/c-link
      C_LINK_LLAMACPP_URL: ${C_LINK_LLAMACPP_URL:?set a private or trusted model-server URL}
      C_LINK_LLAMACPP_API_KEY_FILE: /run/secrets/llamacpp_api_key
      C_LINK_MODEL_NAME: ${C_LINK_MODEL_NAME:-local-model}
      C_LINK_UPSTREAM_MODEL_NAME: ${C_LINK_UPSTREAM_MODEL_NAME:-local-model}
      C_LINK_TENANT_REQUESTS_PER_MINUTE: ${C_LINK_TENANT_REQUESTS_PER_MINUTE:-60}
      C_LINK_MAX_CONCURRENT_GENERATIONS: ${C_LINK_MAX_CONCURRENT_GENERATIONS:-1}
      C_LINK_MAX_OUTPUT_TOKENS: ${C_LINK_MAX_OUTPUT_TOKENS:-4096}
      C_LINK_MAX_REQUEST_BYTES: ${C_LINK_MAX_REQUEST_BYTES:-2097152}
      C_LINK_PROVIDER_TIMEOUT_SECONDS: ${C_LINK_PROVIDER_TIMEOUT_SECONDS:-180}
    volumes:
      - c-link-data:/var/lib/c-link
    expose:
      - "8000"
    networks:
      - backend
      - edge
    secrets:
      - llamacpp_api_key
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      C_LINK_DOMAIN: ${C_LINK_DOMAIN:?set a DNS name pointed at this host}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      c-link:
        condition: service_healthy
    networks:
      - backend
      - edge
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true
  edge:
    driver: bridge

secrets:
  llamacpp_api_key:
    file: ./secrets/llamacpp_api_key

volumes:
  c-link-data:
  caddy-data:
  caddy-config:
