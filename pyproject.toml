[project]
name = "c-link"
version = "0.5.0"
description = "Local-AI context and memory gateway"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
c-link = "c_link.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
